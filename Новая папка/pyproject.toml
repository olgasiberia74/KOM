[project]
name = "simple-python-server"
version = "0.1.0"
description = "A simple Python server with clean architecture using FastAPI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_server"]

[tool.uv]
dev-dependencies = []

[project.scripts]
server = "simple_server.main:main"